<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>✍ Редактор</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  html,body{margin:0;padding:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f5f7;color:#333}
  .vp-boot-msg{margin:120px auto;max-width:520px;padding:24px 28px;background:#fff;border:1px solid #d4d4d8;border-radius:12px;text-align:center;font-size:15px;line-height:1.5;box-shadow:0 4px 16px rgba(0,0,0,.06)}
  .vp-boot-msg b{color:#2563eb}
  .vp-boot-msg code{background:#f0f0f3;padding:2px 6px;border-radius:4px;font-size:13px}
</style>
</head>
<body>
<div class="vp-boot-msg" id="vp-boot">⏳ Загрузка редактора…</div>
<script>
(function(){
  var slot = document.getElementById('vp-boot');
  var html = '';
  try { html = localStorage.getItem('vp_editor_html') || ''; } catch(e) { console.error('[vp-boot] LS:', e); }
  console.log('[vp-boot] html.length=', html.length);
  if (!html || html.length < 200) {
    slot.innerHTML = '⚠ <b>Редактор ещё не открыт.</b><br>Закройте это окно и нажмите <b>✍</b> на главной.';
    return;
  }
  // Defer — document.open() mid-parse в Firefox/Chrome не сбрасывает док.
  setTimeout(function(){
    try {
      console.log('[vp-boot] document.open + write + close...');
      document.open();
      document.write(html);
      document.close();
      console.log('[vp-boot] OK');
    } catch(e) {
      console.error('[vp-boot] write failed:', e);
      try {
        var b = new Blob([html], { type: 'text/html;charset=utf-8' });
        location.replace(URL.createObjectURL(b));
        console.log('[vp-boot] fallback → blob URL');
      } catch(e2) {
        console.error('[vp-boot] blob fallback failed:', e2);
        try { document.documentElement.innerHTML = '<pre style="padding:24px;color:#c00;font:13px monospace">Boot failed: ' + ((e && e.message) || e) + '</pre>'; } catch(_){}
      }
    }
  }, 0);
})();
</script>


<!-- vp-strip-inline -->
<script>
(function(){
  var saved = { orig: null, stripped: null };

  function stripText(t){
    var RE = /[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE00}-\u{FE0F}\u{200D}\u{20E3}]/gu;
    var m = t.match(RE);
    return {
      count: m ? m.length : 0,
      text: t.replace(RE,'')
        .replace(/[ \t]{2,}/g,' ')
        .replace(/[ \t]+$/gm,'')
        .replace(/^[ \t]+/gm,'')
        .replace(/\n{3,}/g,'\n\n')
        .replace(/^\n+|\n+$/g,'')
    };
  }

  function updateBtn(){
    var b = document.getElementById('vp-strip-inline');
    if (!b) return;
    if (saved.stripped !== null) {
      b.textContent = '\u21A9';
      b.title = 'Вернуть эмодзи';
      b.style.background = '#10b981';
      b.style.color = '#fff';
    } else {
      b.textContent = '\uD83D\uDEAB';
      b.title = 'Убрать все эмодзи';
      b.style.background = 'rgba(239,68,68,.15)';
      b.style.color = '#ef4444';
    }
  }

  function handleClick(e){
    e.preventDefault(); e.stopPropagation();
    var s = document.getElementById('src');
    if (!s) return;

    if (saved.orig !== null) {
      if (s.value === saved.stripped) {
        s.value = saved.orig;
        saved.orig = null; saved.stripped = null;
        updateBtn();
        s.dispatchEvent(new Event('input',{bubbles:true}));
        if (typeof toast==='function') toast('Эмодзи возвращены','ok');
        return;
      }
      saved.orig = null; saved.stripped = null;
      updateBtn();
    }

    if (!s.value || !s.value.trim()) {
      if (typeof toast==='function') toast('Введи текст','err');
      return;
    }
    var r = stripText(s.value);
    if (!r.count) {
      if (typeof toast==='function') toast('Эмодзи не найдены','');
      return;
    }
    saved.orig = s.value;
    s.value = r.text;
    saved.stripped = s.value;
    updateBtn();
    s.dispatchEvent(new Event('input',{bubbles:true}));
    if (typeof toast==='function') toast('Убрано: ' + r.count + ' (клик ещё раз — вернуть)','ok');
  }

  function makeBtn(){
    var b = document.createElement('button');
    b.id = 'vp-strip-inline';
    b.type = 'button';
    b.style.cssText =
      'width:24px;height:24px;border-radius:6px;border:none;cursor:pointer;' +
      'font-size:14px;display:inline-flex;align-items:center;justify-content:center;' +
      'padding:0;line-height:1;margin:0 2px;vertical-align:middle;' +
      'font-family:inherit;transition:transform .12s,background .12s,color .12s;';
    b.onclick = handleClick;
    b.onmouseenter = function(){ b.style.transform = 'scale(1.15)'; };
    b.onmouseleave = function(){ b.style.transform = 'scale(1)'; };
    if (saved.stripped !== null) {
      b.textContent = '\u21A9';
      b.title = 'Вернуть эмодзи';
      b.style.background = '#10b981';
      b.style.color = '#fff';
    } else {
      b.textContent = '\uD83D\uDEAB';
      b.title = 'Убрать все эмодзи';
      b.style.background = 'rgba(239,68,68,.15)';
      b.style.color = '#ef4444';
    }
    return b;
  }

  function findAnchor(src){
    var found = [];
    var n = src;
    for (var d=0; d<6 && n; d++, n = n.parentElement) {
      var btns = n.querySelectorAll('button');
      for (var i=0; i<btns.length; i++) {
        var b = btns[i];
        if (b.id === 'vp-strip-inline') continue;
        var t = b.textContent || '';
        if ((t.indexOf('\uD83D\uDCCB') !== -1 || t.indexOf('\uD83D\uDDD1') !== -1)
            && (src.compareDocumentPosition(b) & 2)) {
          found.push(b);
        }
      }
      if (found.length) break;
    }
    return found.length ? found[found.length-1] : null;
  }

  function doInstall(){
    var src = document.getElementById('src');
    if (!src) return;
    var anchor = findAnchor(src);
    if (!anchor || !anchor.parentNode) return;

    var existing = document.getElementById('vp-strip-inline');
    if (existing && existing.parentNode === anchor.parentNode
        && existing.previousElementSibling === anchor) return;
    if (existing && existing.parentNode) existing.parentNode.removeChild(existing);
    anchor.parentNode.insertBefore(makeBtn(), anchor.nextSibling);
  }

  var observer = null;
  function guardedInstall(){
    if (observer) observer.disconnect();
    try { doInstall(); }
    finally { if (observer) observer.observe(document.body, {childList:true, subtree:true}); }
  }

  doInstall();
  setTimeout(doInstall, 300);
  setTimeout(doInstall, 1500);
  try {
    observer = new MutationObserver(guardedInstall);
    observer.observe(document.body, {childList:true, subtree:true});
  } catch(e){}

  document.addEventListener('input', function(e){
    var s = document.getElementById('src');
    if (e.target === s && saved.orig !== null && s.value !== saved.stripped) {
      saved.orig = null; saved.stripped = null;
      updateBtn();
    }
  }, true);
})();
</script>
<!-- /vp-strip-inline -->

</body>
</html>
