<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>✍ Редактор</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  html,body{margin:0;padding:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f5f7;color:#333}
  .vp-boot-msg{margin:120px auto;max-width:520px;padding:24px 28px;background:#fff;border:1px solid #d4d4d8;border-radius:12px;text-align:center;font-size:15px;line-height:1.5;box-shadow:0 4px 16px rgba(0,0,0,.06)}
  .vp-boot-msg b{color:#2563eb}
  .vp-boot-msg code{background:#f0f0f3;padding:2px 6px;border-radius:4px;font-size:13px}
</style>
</head>
<body>
<div class="vp-boot-msg" id="vp-boot">⏳ Загрузка редактора…</div>
<script>
(function(){
  var slot = document.getElementById('vp-boot');
  var html = '';
  try { html = localStorage.getItem('vp_editor_html') || ''; } catch(e) { console.error('[vp-boot] LS:', e); }
  console.log('[vp-boot] html.length=', html.length);
  if (!html || html.length < 200) {
    slot.innerHTML = '⚠ <b>Редактор ещё не открыт.</b><br>Закройте это окно и нажмите <b>✍</b> на главной.';
    return;
  }
  // Defer — document.open() mid-parse в Firefox/Chrome не сбрасывает док.
  setTimeout(function(){
    try {
      console.log('[vp-boot] document.open + write + close...');
      document.open();
      document.write(html);
      document.close();
      console.log('[vp-boot] OK');
    } catch(e) {
      console.error('[vp-boot] write failed:', e);
      try {
        var b = new Blob([html], { type: 'text/html;charset=utf-8' });
        location.replace(URL.createObjectURL(b));
        console.log('[vp-boot] fallback → blob URL');
      } catch(e2) {
        console.error('[vp-boot] blob fallback failed:', e2);
        try { document.documentElement.innerHTML = '<pre style="padding:24px;color:#c00;font:13px monospace">Boot failed: ' + ((e && e.message) || e) + '</pre>'; } catch(_){}
      }
    }
  }, 0);
})();
</script>

<!-- vp-strip-inline -->
<script>
(function(){
  function install(){
    var src = document.getElementById('src');
    if (!src || !src.parentNode) return;
    var parent = src.parentNode;
    if (getComputedStyle(parent).position === 'static') parent.style.position = 'relative';
    var old = document.getElementById('vp-strip-inline');
    if (old) old.remove();
    var btn = document.createElement('button');
    btn.id = 'vp-strip-inline';
    btn.type = 'button';
    btn.title = 'Убрать все эмодзи';
    btn.textContent = '🚫';
    btn.style.cssText =
      'position:absolute!important;bottom:8px!important;right:8px!important;' +
      'width:24px!important;height:24px!important;border-radius:6px!important;' +
      'background:rgba(239,68,68,.15)!important;color:#ef4444!important;' +
      'border:none!important;cursor:pointer!important;font-size:13px!important;' +
      'display:flex!important;align-items:center!important;justify-content:center!important;' +
      'box-shadow:none!important;z-index:10!important;padding:0!important;' +
      'line-height:1!important;font-family:inherit!important;opacity:.7!important;' +
      'transition:opacity .15s,background .15s,color .15s!important;';
    btn.addEventListener('mouseenter', function(){
      btn.style.opacity='1'; btn.style.background='#ef4444'; btn.style.color='#fff';
    });
    btn.addEventListener('mouseleave', function(){
      btn.style.opacity='.7'; btn.style.background='rgba(239,68,68,.15)'; btn.style.color='#ef4444';
    });
    btn.addEventListener('click', function(e){
      e.preventDefault(); e.stopPropagation();
      var s = document.getElementById('src');
      if (!s || !s.value || !s.value.trim()) {
        if (typeof toast==='function') toast('Введи текст','err');
        return;
      }
      var RE = /[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE00}-\u{FE0F}\u{200D}\u{20E3}]/gu;
      var m = s.value.match(RE); var cnt = m ? m.length : 0;
      if (!cnt) { if (typeof toast==='function') toast('Эмодзи не найдены',''); return; }
      s.value = s.value.replace(RE,'')
        .replace(/[ \t]{2,}/g,' ').replace(/[ \t]+$/gm,'').replace(/^[ \t]+/gm,'')
        .replace(/\n{3,}/g,'\n\n').replace(/^\n+|\n+$/g,'');
      s.dispatchEvent(new Event('input',{bubbles:true}));
      if (typeof toast==='function') toast('Убрано эмодзи: ' + cnt, 'ok');
    });
    parent.appendChild(btn);
  }
  install();
  setTimeout(install, 300);
  setTimeout(install, 1000);
  try { new MutationObserver(install).observe(document.body, {childList:true, subtree:true}); } catch(e) {}
})();
</script>
<!-- /vp-strip-inline -->

</body>
</html>
