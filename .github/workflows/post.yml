name: VK Poster

on:
  schedule:
    - cron: '0 * * * *'      # основной тик (11:00 UTC = 18:00 KRAT)
    - cron: '15 * * * *'     # страховка №1
    - cron: '45 * * * *'     # страховка №2
    - cron: '30 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force publish now (ignore post_time)'
        type: boolean
        default: false  # безопасно: force надо включать руками
      date:
        description: 'Emulate Slavic date (YYYY-MM-DD, empty = today)'
        type: string
        required: false
        default: ''

permissions:
  contents: write
  issues: write   # для уведомлений о сбоях

concurrency:
  group: vk-poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Install deps
        run: pip install --quiet requests

      - name: Write config from secret
        env: { VK_CONFIG: '${{ secrets.VK_CONFIG }}' }
        run: printf '%s' "$VK_CONFIG" > config.main.json

      - name: Setup SSH deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null
          echo "DEPLOY_KEY fingerprint:"; ssh-keygen -lf ~/.ssh/deploy_key || true
          git config user.name  'vk-poster-bot'
          git config user.email 'bot@users.noreply.github.com'
          git remote set-url origin "git@github.com:${{ github.repository }}.git"

      - name: Run poster
        env:
          TZ: Asia/Krasnoyarsk           # ⚠️ КРИТИЧНО — без этого slavic_now не сдвинется
          GIT_SSH_COMMAND: 'ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes'
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "── Mode: FORCE (ignore post_time) ──"
            python3 poster.py config.main.json --force ${{ inputs.date != '' && format('--date {0}', inputs.date) || '' }} 2>&1 | tee /tmp/poster.log
          else
            echo "── Mode: NORMAL (respect post_time) ──"
            python3 poster.py config.main.json 2>&1 | tee /tmp/poster.log
          fi

          # Fail CI if photo was expected but failed to attach
          if grep -q 'PHOTO_MISSING=1' /tmp/poster.log; then
            echo "::error::Photo failed to attach — VK upload glitch or missing file, see log"
            exit 1
          fi

      - name: Commit & push state → triggers Pages
        run: |
          if git diff --quiet -- 'state-*.json'; then
            echo "state не изменился — пропуск"
            exit 0
          fi
          git add 'state-*.json'
          git commit -m "state: auto $(date -u +%Y-%m-%d_%H:%M)"
          GIT_SSH_COMMAND='ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes' \
            git push origin main

      # ── Уведомление о провале (вариант B: GitHub Issue) ──
      - name: Report failure as GitHub Issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '⚠️ VK Poster FAILED';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const when = new Date().toISOString();
            const body = [
              '## Провал автопостинга в ВК',
              '',
              `- **Run:** #${context.runNumber}`,
              `- **Когда:** ${when}`,
              `- **Триггер:** ${context.eventName}`,
              `- **Ссылка:** ${runUrl}`,
              '',
              '### Что делать',
              '1. Открой ссылку выше.',
              '2. Нажми на красный шаг с крестиком.',
              '3. Прочитай последние 20–30 строк лога.',
              '4. Частые причины: истёк токен ВК / битая картинка / временный сбой VK.'
            ].join('\n');
            const q = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "VK Poster FAILED"`;
            const found = await github.rest.search.issuesAndPullRequests({ q });
            if (found.data.total_count > 0) {
              const n = found.data.items[0].number;
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: n,
                body: `🔁 Ещё один провал: [run #${context.runNumber}](${runUrl}) в ${when}`
              });
              core.info(`Добавил комментарий в Issue #${n}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body
              });
              core.info(`Создал Issue #${created.data.number}`);
            }

      # ── Авто-закрытие Issue при следующем успехе ──
      - name: Close failure issue on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const q = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "VK Poster FAILED"`;
            const found = await github.rest.search.issuesAndPullRequests({ q });
            if (found.data.total_count === 0) {
              core.info('Открытых failure-Issue нет — закрывать нечего');
            } else {
              const issue = found.data.items[0];
              const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ Автоматически закрыто: [run #${context.runNumber}](${runUrl}) прошёл успешно.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
              core.info(`Закрыл Issue #${issue.number}`);
            }
