name: Check VK Tokens
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Check tokens from SECRET
        env:
          VK_CONFIG: ${{ secrets.VK_CONFIG }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, urllib.parse
          cfg = json.loads(os.environ["VK_CONFIG"])
          def call(method, token, **params):
              params.update({"access_token": token, "v": "5.199"})
              url = "https://api.vk.com/method/" + method + "?" + urllib.parse.urlencode(params)
              return json.loads(urllib.request.urlopen(url, timeout=15).read().decode())
          for key in ("token", "user_token"):
              tok = cfg.get(key, "")
              print(f"--- поле {key}: ...{tok[-6:]} (длина {len(tok)}) ---")
              r = call("groups.getTokenPermissions", tok)
              e = r.get("error")
              if e:
                  print("  getTokenPermissions: ОШИБКА", e["error_code"], "-", e["error_msg"])
              else:
                  perm = r["response"].get("permissions", [])
                  names = [p.get("name") for p in perm]
                  print("  права:", ", ".join(names) or "(нет)")
          r = call("users.get", cfg.get("user_token",""))
          e = r.get("error")
          if e: print("user_token owner: ОШИБКА", e["error_code"], e["error_msg"])
          else:
              resp = r.get("response") or []
              if resp:
                  u = resp[0]
                  print(f"user_token owner: id{u['id']} {u.get('first_name','')} {u.get('last_name','')}")
              else:
                  print("user_token owner: пусто (похоже на group-токен)")
          PYEOF
