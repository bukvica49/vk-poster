name: Attach Photo to Post

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: 'VK post_id (число, напр. 2668)'
        required: true
        type: string
      image:
        description: 'Имя файла в images/ (напр. d_r_t.jpg)'
        required: true
        default: 'd_r_t.jpg'
        type: string

permissions:
  contents: read

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Install deps
        run: pip install --quiet requests

      - name: Write config from secret
        env: { VK_CONFIG: '${{ secrets.VK_CONFIG }}' }
        run: printf '%s' "$VK_CONFIG" > config.main.json

      - name: Show config keys (без значений)
        run: |
          python3 - <<'PY'
          import json
          c = json.loads(open('config.main.json').read())
          print('keys:', list(c.keys()))
          print('has user_token:', bool(c.get('user_token')))
          tok = c.get('user_token') or c.get('token') or ''
          print('token length:', len(tok))
          PY

      - name: VK token diagnostics
        run: |
          python3 - <<'PY'
          import json, requests
          c = json.loads(open('config.main.json').read())
          tok = c.get('user_token') or c['token']
          api = 'https://api.vk.com/method/'
          def call(m, **p):
              r = requests.post(f'{api}{m}', data={**p, 'access_token': tok, 'v': '5.199'}, timeout=20).json()
              return r
          print('users.get:', call('users.get'))
          print('account.getAppPermissions:', call('account.getAppPermissions'))
          print('groups.getById:', call('groups.getById', group_id=c['group_id']))
          PY

      - name: Attach photo
        run: python3 attach_photo.py "${{ inputs.post_id }}" "images/${{ inputs.image }}"
