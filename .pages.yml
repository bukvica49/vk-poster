media:
  input: images
  output: /images

content:
  - name: holidays
    label: Праздники
    type: collection
    path: content/holidays
    format: json
    filename: "{primary}.json"
    view:
      primary: slug
      sort: date
      default:
        sort: date
    fields:
      - name: slug
        label: Slug (URL-имя файла, латиница)
        type: string
        required: true
        description: "Используется в URL: .../collection/holidays/<slug>. Например: den-bogini-makoshi"
      - name: date
        label: Дата поста (MM-DD)
        type: string
        required: true
        pattern: '\d{2}-\d{2}'
        description: "Дата поста: MM-DD (напр. 11-10 = 10 ноября). Пост выйдет в этот день в 18:00 KRAT."
      - name: date_to
        label: Дата окончания (MM-DD, для диапазона)
        type: string
        required: false
        pattern: '\d{2}-\d{2}'
        description: "Для диапазонных постов (вход в Чертог): дата окончания периода, MM-DD. Пример: 12-15. Пусто = однодневный пост."
      - name: chertog
        label: Чертог (для диапазона)
        type: string
        required: false
        description: "Название Чертога (напр. Змей, Волк). Включает специальный шаблон поста. Пусто = обычный праздник."
      - name: text
        label: Текст поста (заголовок карточки)
        type: string
        required: true
      - name: image
        label: Фото
        type: image
      - name: info
        label: Ручной инфо-блок (пусто = авто)
        type: string
        list: true
      - name: text_md
        label: "📣 Текст поста для VK (markdown)"
        type: rich-text
        required: false
        description: "VK понимает: жирный, курсив, зачёркнутый, ссылки, хэштеги, emoji. Заголовки/списки конвертируются в poster.py."
      - name: post_time
        label: "⏰ Время поста (ЧЧ:ММ или ЧЧ-ММ, KRAT)"
        type: string
        required: false
        placeholder: "18:00"
        pattern: '^\d{2}[-:]\d{2}$'
        description: "Время публикации в KRAT (UTC+7). Пусто = 18:00. Примеры: 09:00, 21:30, 19-50, 02-00 (допустимы как :, так и -)."

  - name: chertogs
    label: Чертоги
    type: file
    path: chertogs.json
    format: json
    fields:
      - {name: _comment, type: string, hidden: true}
      - {name: "1",  label: "1. Вепрь",            type: object, fields: [{name: name, label: Название, type: string}, {name: patron, label: Покровитель, type: string}, {name: tree, label: Дерево, type: string}]}
      - {name: "2",  label: "2. Щука",             type: object, fields: [{name: name, label: Название, type: string}, {name: patron, label: Покровитель, type: string}, {name: tree, label: Дерево, type: string}]}
      - {name: "3",  label: "3. Лебедь",           type: object, fields: [{name: name, label: Название, type: string}, {name: patron, label: Покровитель, type: string}, {name: tree, label: Дерево, type: string}]}
      - {name: "4",  label: "4. Змей",             type: object, fields: [{name: name, label: Название, type: string}, {name: patron, label: Покровитель, type: string}, {name: tree, label: Дерево, type: string}]}
      - {name: "5",  label: "5. Ворон",            type: object, fields: [{name: name, label: Название, type: string}, {name: patron, label: Покровитель, type: string}, {name: tree, label: Дерево, type: string}]}
      - {name: "6",  label: "6. Медведь",          type: object, fields: [{name: name, label: Название, type: string}, {name: patron, label: Покровитель, type: string}, {name: tree, label: Дерево, type: string}]}
      - {name: "7",  label: "7. Бусл (аист)",      type: object, fields: [{name: name, label: Название, type: string}, {name: patron, label: Покровитель, type: string}, {name: tree, label: Дерево, type: string}]}
      - {name: "8",  label: "8. Волк (Белый Пёс)", type: object, fields: [{name: name, label: Название, type: string}, {name: patron, label: Покровитель, type: string}, {name: tree, label: Дерево, type: string}]}
      - {name: "9",  label: "9. Лиса",             type: object, fields: [{name: name, label: Название, type: string}, {name: patron, label: Покровитель, type: string}, {name: tree, label: Дерево, type: string}]}
      - {name: "10", label: "10. Тур",             type: object, fields: [{name: name, label: Название, type: string}, {name: patron, label: Покровитель, type: string}, {name: tree, label: Дерево, type: string}]}
      - {name: "11", label: "11. Лось",            type: object, fields: [{name: name, label: Название, type: string}, {name: patron, label: Покровитель, type: string}, {name: tree, label: Дерево, type: string}]}
      - {name: "12", label: "12. Финист",          type: object, fields: [{name: name, label: Название, type: string}, {name: patron, label: Покровитель, type: string}, {name: tree, label: Дерево, type: string}]}
      - {name: "13", label: "13. Конь",            type: object, fields: [{name: name, label: Название, type: string}, {name: patron, label: Покровитель, type: string}, {name: tree, label: Дерево, type: string}]}
      - {name: "14", label: "14. Орёл",            type: object, fields: [{name: name, label: Название, type: string}, {name: patron, label: Покровитель, type: string}, {name: tree, label: Дерево, type: string}]}
      - {name: "15", label: "15. Раса (Леопард)",  type: object, fields: [{name: name, label: Название, type: string}, {name: patron, label: Покровитель, type: string}, {name: tree, label: Дерево, type: string}]}
      - {name: "16", label: "16. Дева",            type: object, fields: [{name: name, label: Название, type: string}, {name: patron, label: Покровитель, type: string}, {name: tree, label: Дерево, type: string}]}

  - name: krugolyety
    label: Круголеты
    type: file
    path: krugolyety.json
    format: json
    fields:
      - {name: _comment, type: string, hidden: true}
      - {name: "1",  type: string}
      - {name: "2",  type: string}
      - {name: "3",  type: string}
      - {name: "4",  type: string}
      - {name: "5",  type: string}
      - {name: "6",  type: string}
      - {name: "7",  type: string}
      - {name: "8",  type: string}
      - {name: "9",  type: string}
      - {name: "10", type: string}
      - {name: "11", type: string}
